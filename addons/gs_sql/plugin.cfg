[plugin]

name="gs-sql"
description="SQL for the Gamespice family: SQLite through a GDExtension, PostgreSQL and MySQL through an HTTP gateway, one dialect layer, tables as plain data, and versioned migrations. Stores in other addons reach it duck-typed, so none of them depends on it. Depends only on gs-core."
author="dot"
version="0.1.0"
script="gs_sql_plugin.gd"
